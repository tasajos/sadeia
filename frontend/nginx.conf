server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  # API REST y archivos subidos → backend Node
  location /api/     { proxy_pass http://backend:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /uploads/ { proxy_pass http://backend:4000; }

  # Tiempo real (Socket.IO / WebSocket)
  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # SPA: React Router
  location / { try_files $uri /index.html; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
}
